<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Redirecting to Admin Panel | Araa Softwares</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#111835" />
    <link rel="icon" href="/logo.png" />
    <noscript
      ><meta
        http-equiv="refresh"
        content="3;url=https://araa-posts-admin.web.app"
    /></noscript>
    <style>
      :root {
        --y: #f4d532;
        --n: #111835;
        --b: #2948c2;
        --w: #fbfdfc;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: var(--n);
        color: var(--w);
        display: grid;
        place-items: center;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        padding: 20px;
      }
      .blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.5;
        animation: float 12s ease-in-out infinite;
        pointer-events: none;
      }
      .b1 {
        width: 360px;
        height: 360px;
        background: var(--b);
        top: -100px;
        left: -80px;
      }
      .b2 {
        width: 300px;
        height: 300px;
        background: var(--y);
        opacity: 0.18;
        bottom: -90px;
        right: -60px;
        animation-delay: -5s;
      }
      @keyframes float {
        50% {
          transform: translate(30px, 40px) scale(1.1);
        }
      }
      .card {
        position: relative;
        width: min(420px, 100%);
        text-align: center;
        padding: 40px 28px 32px;
        border-radius: 28px;
        border: 1px solid rgba(251, 253, 252, 0.12);
        background: rgba(251, 253, 252, 0.06);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 30px 60px -20px #000a;
        animation: in 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
      }
      .ring {
        position: relative;
        width: 96px;
        height: 96px;
        margin: 0 auto 22px;
      }
      .ring svg {
        position: absolute;
        inset: 0;
        transform: rotate(-90deg);
      }
      .ring circle {
        fill: none;
        stroke-width: 4;
      }
      .ring .t {
        stroke: rgba(251, 253, 252, 0.12);
      }
      .ring .p {
        stroke: var(--y);
        stroke-linecap: round;
        stroke-dasharray: 289;
        stroke-dashoffset: 289;
      }
      .ring img {
        position: absolute;
        inset: 16px;
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--y);
        margin-bottom: 10px;
      }
      h1 {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }
      p {
        margin-top: 10px;
        font-size: 15px;
        color: rgba(251, 253, 252, 0.65);
      }
      p b {
        color: var(--y);
        font-weight: 700;
        display: inline-block;
        min-width: 1ch;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 26px;
        padding: 13px 26px;
        border-radius: 999px;
        background: var(--y);
        color: var(--n);
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        transition: 0.25s;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px -8px var(--y);
      }
      .btn svg {
        width: 18px;
        height: 18px;
      }
      .stay {
        display: block;
        margin: 16px auto 0;
        background: none;
        border: 0;
        color: rgba(251, 253, 252, 0.55);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .stay:hover {
        color: #fff;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <main class="card" role="status" aria-live="polite">
      <div class="ring">
        <svg viewBox="0 0 100 100">
          <circle class="t" cx="50" cy="50" r="46" />
          <circle class="p" id="p" cx="50" cy="50" r="46" />
        </svg>
        <img src="/logo.png" alt="Araa Softwares" />
      </div>
      <div class="eyebrow">Araa Softwares</div>
      <h1>Taking you to the Admin Panel</h1>
      <p id="msg">Redirecting in <b id="n">3</b> seconds…</p>
      <a class="btn" href="https://araa-posts-admin.web.app"
        >Go now
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14M13 6l6 6-6 6" /></svg
      ></a>
      <button class="stay" id="stay" type="button">Cancel</button>
    </main>
    <script>
      (function () {
        var URL_ = "https://araa-posts-admin.web.app",
          SECS = 3,
          left = SECS,
          done = false;
        var n = document.getElementById("n"),
          p = document.getElementById("p"),
          msg = document.getElementById("msg");
        var start = performance.now(),
          raf;
        function frame(t) {
          if (done) return;
          var k = Math.min((t - start) / (SECS * 1000), 1);
          p.style.strokeDashoffset = 289 * (1 - k);
          raf = requestAnimationFrame(frame);
        }
        raf = requestAnimationFrame(frame);
        var iv = setInterval(function () {
          left--;
          n.textContent = Math.max(left, 0);
          if (left <= 0) {
            clearInterval(iv);
            location.replace(URL_);
          }
        }, 1000);
        document.getElementById("stay").onclick = function () {
          done = true;
          clearInterval(iv);
          cancelAnimationFrame(raf);
          p.style.strokeDashoffset = 289;
          msg.textContent = "Redirect cancelled.";
          this.remove();
        };
      })();
    </script>
  </body>
</html>
